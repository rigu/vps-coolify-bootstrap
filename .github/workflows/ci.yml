name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: bash -n scripts/*.sh

      - name: Script help checks
        run: |
          bash scripts/generate-secrets.sh --help >/dev/null
          bash scripts/prepare-cloud-init.sh --help >/dev/null

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $parseErrors += "$($_.Name): $($errors | ForEach-Object { $_.Message } | Select-Object -First 1)"
            }
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Basic docs consistency
        run: |
          test -f docs/index.md
          test -f docs/getting-started.md
          test -f docs/bootstrap-flow.md
          test -f docs/operations-security.md
          test -f docs/bootstrap-failure-recovery.md

      - name: Ensure license exists
        run: test -f LICENSE
