name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml

      - name: Bash syntax check
        run: bash -n scripts/*.sh

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: YAML parse checks
        run: |
          python3 - <<'PY'
          import yaml
          from pathlib import Path

          for rel in ("templates/vps-init.template.yml", "docs/_config.yml"):
              path = Path(rel)
              with path.open("r", encoding="utf-8") as f:
                  yaml.safe_load(f)
          print("YAML parse checks passed")
          PY

      - name: Script help checks
        run: |
          bash scripts/generate-secrets.sh --help >/dev/null
          bash scripts/prepare-vps-coolify-init.sh --help >/dev/null
          bash scripts/recover-ssh-access.sh --help >/dev/null
          bash scripts/update-realtime-mode.sh --help >/dev/null

      - name: Script behavior tests
        run: bash tests/run-tests.sh

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $parseErrors += "$($_.Name): $($errors | ForEach-Object { $_.Message } | Select-Object -First 1)"
            }
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Basic docs consistency
        run: |
          test -f docs/index.md
          test -f docs/getting-started.md
          test -f docs/bootstrap-flow.md
          test -f docs/vps-coolify-deployment-modes.md
          test -f docs/vps-coolify-realtime-modes.md
          test -f docs/operations-security.md
          test -f docs/bootstrap-failure-recovery.md
          test -f docs/github-promotion.md
          test -f docs/assets/bootstrap-overview.svg

      - name: Ensure license exists
        run: test -f LICENSE
