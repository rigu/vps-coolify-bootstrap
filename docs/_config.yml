title: VPS Coolify Bootstrap
description: Production-ready VPS bootstrap for Coolify on Ubuntu 24.04 with VPS init user-data, security hardening, and recovery runbooks.
url: https://rigu.github.io
baseurl: /vps-coolify-bootstrap
theme: minima
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
  - scope:
      path: "index.md"
      type: "pages"
    values:
      title: VPS Coolify Bootstrap Docs
      description: Canonical documentation for production VPS bootstrapping with Coolify on Ubuntu 24.04.
  - scope:
      path: "getting-started.md"
      type: "pages"
    values:
      title: Getting Started
      description: End-to-end setup steps for preparing env values, rendering VPS-Coolify init, and provisioning the VPS.
  - scope:
      path: "bootstrap-flow.md"
      type: "pages"
    values:
      title: Bootstrap Flow
      description: Detailed first-boot execution order, VPS init behavior, and bootstrap flow for Coolify provisioning.
  - scope:
      path: "vps-coolify-deployment-modes.md"
      type: "pages"
    values:
      title: VPS Coolify Deployment Modes
      description: Complete reference for all VPS deployment modes supported by this bootstrap.
  - scope:
      path: "vps-coolify-realtime-modes.md"
      type: "pages"
    values:
      title: VPS Coolify Realtime Modes
      description: Detailed realtime behavior for CLOSE_COOLIFY_REALTIME_PORTS true/false, risks, and update procedures.
  - scope:
      path: "operations-security.md"
      type: "pages"
    values:
      title: Operations and Security
      description: Production operations guidance for post-bootstrap hardening, monitoring, and Coolify-safe server operation.
  - scope:
      path: "bootstrap-failure-recovery.md"
      type: "pages"
    values:
      title: Bootstrap Failure Recovery
      description: Step-by-step runbook to recover failed first-boot VPS init/bootstrap execution.
  - scope:
      path: "github-promotion.md"
      type: "pages"
    values:
      title: GitHub Promotion Checklist
      description: Practical checklist to improve repository discoverability on GitHub and search engines.
header_pages:
  - index.md
  - getting-started.md
  - bootstrap-flow.md
  - vps-coolify-deployment-modes.md
  - vps-coolify-realtime-modes.md
  - operations-security.md
  - bootstrap-failure-recovery.md
  - github-promotion.md
