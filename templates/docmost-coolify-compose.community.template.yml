# Docmost Community Compose for Coolify (external infra profile)
#
# Purpose:
# - run Docmost app on Coolify
# - consume shared infra services from external Docker network `infra`
# - keep env variables visible/editable in Coolify UI
#
# Recommended production use:
# - pin DOCMOST_IMAGE to a versioned tag/digest in env values
# - keep this stack attached to `infra` for Postgres + Valkey access
# - keep restart policy + healthcheck enabled so startup races self-recover
#
# Notes:
# - `depends_on` is intentionally not used for postgres-apps/valkey-apps
#   because they are external services from another compose project.
# - required `${VAR:?...}` checks are used on critical values so deploy fails
#   fast when env setup is incomplete.

services:
  docmost:
    image: "${DOCMOST_IMAGE:-docmost/docmost:latest}"
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      APP_URL: ${APP_URL:?Missing APP_URL}
      APP_SECRET: ${APP_SECRET:?Missing APP_SECRET}
      DATABASE_URL: ${DATABASE_URL:?Missing DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Missing REDIS_URL}
      PORT: ${PORT:-3000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Docmost}
      DRAWIO_URL: ${DRAWIO_URL:-https://embed.diagrams.net/?spin=1&proto=json&configure=1}
      AWS_S3_ACCESS_KEY_ID: ${AWS_S3_ACCESS_KEY_ID:-}
      AWS_S3_SECRET_ACCESS_KEY: ${AWS_S3_SECRET_ACCESS_KEY:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-eu-central-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-plane-uploads}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://seaweedfs-plane:8333}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-true}
      DISABLE_TELEMETRY: ${DISABLE_TELEMETRY:-true}
      FILE_UPLOAD_SIZE_LIMIT: ${FILE_UPLOAD_SIZE_LIMIT:-50mb}
      FILE_IMPORT_SIZE_LIMIT: ${FILE_IMPORT_SIZE_LIMIT:-200mb}
    volumes:
      - docmost_storage:/app/data/storage
    networks:
      - default
      - infra
    healthcheck:
      # Prefer a Node-based probe, with wget/curl fallbacks for image changes.
      test:
        - CMD-SHELL
        - >
          if command -v node >/dev/null 2>&1; then
            node -e "const http=require('http');const req=http.get('http://127.0.0.1:3000/api/health',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.setTimeout(5000,()=>{req.destroy();process.exit(1);});";
          elif command -v wget >/dev/null 2>&1; then
            wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1;
          elif command -v curl >/dev/null 2>&1; then
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1;
          else
            exit 1;
          fi
      interval: 15s
      timeout: 10s
      retries: 10

networks:
  infra:
    external: true
    name: ${INFRA_NETWORK_NAME:-infra}

volumes:
  docmost_storage:
