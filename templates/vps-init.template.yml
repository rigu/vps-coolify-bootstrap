#cloud-config
timezone: TIMEZONE_HERE
package_update: true
package_upgrade: true
output:
  all: '| tee -a /var/log/vps-bootstrap.log'

users:
  - name: DEVOPS_USER_HERE
    groups: [sudo]
    shell: /bin/bash
    sudo: ["DEVOPS_USER_SUDO_SPEC_HERE"]
    # DEVOPS_SSH_AUTHORIZED_KEYS_BLOCK_HERE

  - name: COOLIFY_SUDO_NOPASSWD_USER_HERE
    groups: [sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL:ALL) NOPASSWD:ALL"]

ssh_pwauth: false
disable_root: true

packages:
  - ca-certificates
  - curl
  - git
  - openssl
  - python3
  - ufw
  - fail2ban
  - unattended-upgrades

write_files:
  - path: /etc/sysctl.d/99-hardening.conf
    permissions: "0644"
    content: |
      net.ipv4.ip_forward=1
      net.ipv4.conf.all.rp_filter=1
      net.ipv4.conf.default.rp_filter=1
      net.ipv4.conf.all.accept_redirects=0
      net.ipv4.conf.default.accept_redirects=0
      net.ipv4.conf.all.send_redirects=0
      net.ipv4.conf.default.send_redirects=0
      net.ipv4.conf.all.accept_source_route=0
      net.ipv4.conf.default.accept_source_route=0
      net.ipv4.tcp_syncookies=1
      net.ipv6.conf.all.accept_redirects=0
      net.ipv6.conf.default.accept_redirects=0
      net.ipv6.conf.all.accept_source_route=0
      net.ipv6.conf.default.accept_source_route=0

  - path: /etc/ssh/sshd_config.d/10-bootstrap-hardening.conf
    permissions: "0644"
    content: |
      Port SSH_PORT_HERE
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PermitEmptyPasswords no
      PubkeyAuthentication yes
      X11Forwarding no
      AllowAgentForwarding no
      AllowTcpForwarding local
      PermitTunnel no
      GatewayPorts no
      MaxAuthTries 3
      LoginGraceTime 30
      ClientAliveInterval 300
      ClientAliveCountMax 2
      AllowUsers DEVOPS_USER_HERE COOLIFY_SUDO_NOPASSWD_USER_HERE

  - path: /etc/fail2ban/jail.d/10-bootstrap-sshd.local
    permissions: "0644"
    content: |
      [DEFAULT]
      backend = systemd
      banaction = ufw
      bantime = 1h
      findtime = 10m
      maxretry = 5
      bantime.increment = true
      bantime.factor = 2
      bantime.maxtime = 7d

      [sshd]
      enabled = true
      port = SSH_PORT_HERE

  - path: /etc/vps-coolify-bootstrap/bootstrap.env
    permissions: "0600"
    content: |
      SSH_PORT=SSH_PORT_HERE
      DEVOPS_USER='DEVOPS_USER_HERE'
      COOLIFY_SUDO_NOPASSWD_USER='COOLIFY_SUDO_NOPASSWD_USER_HERE'
      SSH_PUBLIC_KEY='BOOTSTRAP_SSH_PUBLIC_KEY_HERE'
      SSH_KEY_ROTATE=SSH_KEY_ROTATE_HERE
      ADDITIONAL_SUDO_USERS=ADDITIONAL_SUDO_USERS_HERE
      DEVOPS_USER_NOPASSWD=DEVOPS_USER_NOPASSWD_HERE
      DOCKER_USERS=DOCKER_USERS_HERE
      MANAGEMENT_CIDRS=MANAGEMENT_CIDRS_HERE
      EXTRA_ALLOWED_TCP_PORTS=EXTRA_ALLOWED_TCP_PORTS_HERE
      EXTRA_ALLOWED_UDP_PORTS=EXTRA_ALLOWED_UDP_PORTS_HERE
      CLOSE_COOLIFY_REALTIME_PORTS=CLOSE_COOLIFY_REALTIME_PORTS_HERE
      DOCKER_DISABLE_IPV6_FOR_PARSEADDR_FIX=DOCKER_DISABLE_IPV6_FOR_PARSEADDR_FIX_HERE
      COOLIFY_REALTIME_DOMAIN='COOLIFY_REALTIME_DOMAIN_HERE'
      COOLIFY_PUBLIC_DOMAIN='COOLIFY_PUBLIC_DOMAIN_HERE'
      COOLIFY_ROOT_USERNAME='COOLIFY_ROOT_USERNAME_HERE'
      COOLIFY_ROOT_USER_EMAIL='COOLIFY_ROOT_USER_EMAIL_HERE'
      COOLIFY_ROOT_USER_PASSWORD='COOLIFY_ROOT_USER_PASSWORD_HERE'
      USER_PASSWORDS_ENCRYPTION_PASSWORD='USER_PASSWORDS_ENCRYPTION_PASSWORD_HERE'
      BOOTSTRAP_EXPECTED_SHA='BOOTSTRAP_EXPECTED_SHA_HERE'

runcmd:
  - |
    set -euo pipefail
    
    repo_dir="/opt/vps-coolify-bootstrap"
    repo_url='BOOTSTRAP_REPO_URL_HERE'
    repo_ref='BOOTSTRAP_REPO_REF_HERE'
    expected_sha='BOOTSTRAP_EXPECTED_SHA_HERE'

    # Supply-chain protection: verify the fetched commit matches expected SHA.
    # This prevents execution of tampered code even if the ref (branch/tag) is moved.
    verify_sha() {
      local actual_sha
      actual_sha="$(git -C "$repo_dir" rev-parse HEAD)"
      
      # If expected_sha is empty or placeholder, skip verification (dev mode warning)
      if [ -z "$expected_sha" ] || [ "$expected_sha" = "BOOTSTRAP_EXPECTED_SHA_HERE" ]; then
        echo "WARNING: BOOTSTRAP_EXPECTED_SHA not set - skipping integrity verification" >&2
        echo "WARNING: This is acceptable for development but NOT for production" >&2
        return 0
      fi
      
      if [ "$actual_sha" != "$expected_sha" ]; then
        echo "FATAL: Bootstrap SHA mismatch!" >&2
        echo "Expected: $expected_sha" >&2
        echo "Actual:   $actual_sha" >&2
        echo "This may indicate a tampered or moved ref. Aborting for security." >&2
        exit 1
      fi
      
      echo "Bootstrap SHA verified: $actual_sha"
    }

    if [ -d "$repo_dir/.git" ]; then
      # Keep origin aligned with repo_url in case env changed since a prior run.
      git -C "$repo_dir" remote set-url origin "$repo_url"
      if ! git -C "$repo_dir" fetch --depth 1 origin "$repo_ref"; then
        echo "ERROR: failed to fetch $repo_ref from $repo_url" >&2
        exit 1
      fi
      git -C "$repo_dir" checkout --force FETCH_HEAD
    else
      rm -rf "$repo_dir"
      # Use git init + fetch pattern for maximum compatibility with SHA refs
      git init "$repo_dir"
      git -C "$repo_dir" remote add origin "$repo_url"
      if ! git -C "$repo_dir" fetch --depth 1 origin "$repo_ref"; then
        echo "ERROR: failed to fetch $repo_ref from $repo_url" >&2
        exit 1
      fi
      git -C "$repo_dir" checkout --force FETCH_HEAD
    fi
    
    # Verify SHA before executing any bootstrap code
    verify_sha

    sysctl --system
    bash "$repo_dir/scripts/bootstrap-host.sh" /etc/vps-coolify-bootstrap/bootstrap.env

final_message: |
  Bootstrap complete.
  Verify SSH access first: ssh -p SSH_PORT_HERE DEVOPS_USER_HERE@<your-server-ip>
  Coolify onboarding URL: http://<your-server-ip>:8000
  Complete Coolify onboarding in browser and set domain: COOLIFY_PUBLIC_DOMAIN_HERE
  Final URL after onboarding: https://COOLIFY_PUBLIC_DOMAIN_HERE
